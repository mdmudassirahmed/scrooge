<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-label="Measured two days after apply: cost per call -40%, context per call -38%, calls over 300k 29% to 8%, Sonnet share 8% to 41%, subagent spend -77%, repeated reads -43%">
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FFD166"/></linearGradient></defs>
  <rect width="1200" height="230" rx="18" fill="#0B1220"/>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
